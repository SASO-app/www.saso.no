<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SASO Eiendom er en familiedrevet eiendomsbedrift som pusser opp, investerer i og forvalter boliger – bygget av Sander og Marita, sammen med barna."
    />
    <title>SASO Eiendom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&family=Unbounded:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Statiske skjemaer slik at Netlify oppdager dem ved bygg -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="navn" />
      <input type="email" name="epost" />
      <input type="tel" name="telefon" />
      <select name="jeg-er">
        <option>Boligeier</option>
        <option>Investor</option>
        <option>Leietaker</option>
        <option>Annet</option>
      </select>
      <textarea name="melding"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="samarbeid" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="merkevare" />
      <input type="text" name="kontaktperson" />
      <input type="email" name="epost" />
      <textarea name="melding"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
