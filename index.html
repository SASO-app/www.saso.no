<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SASO Eiendom – utleie, salg og forvaltning av bolig- og næringseiendom. Trygg og profesjonell eiendomspartner."
    />
    <title>SASO Eiendom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Statisk skjema slik at Netlify oppdager "kontakt"-skjemaet ved bygg -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="navn" />
      <input type="email" name="epost" />
      <input type="tel" name="telefon" />
      <select name="emne">
        <option>Utleie</option>
        <option>Salg</option>
        <option>Forvaltning</option>
        <option>Annet</option>
      </select>
      <textarea name="melding"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
